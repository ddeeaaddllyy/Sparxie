[package]
name = "zeit_bot"
version = "0.4.5-df6-tf1" # prod.result.fix-discordfix-telegramfix
authors = ["ddeeaaddllyy"]
edition = "2021"

[dependencies]
serenity = { version = "0.12", default-features = false, features = [
    "client",
    "gateway",
    "model",
    "rustls_backend",
    "cache"
] }
songbird = { version = "0.6.0", features = [
    "builtin-queue",
    "driver",
    "rustls",
    "serenity"
] }
#
# Songbird uses Symphonia to parse/decode media containers returned by yt-dlp.
# YouTube commonly returns WebM/Opus (`mkv` parser in Symphonia) or M4A/AAC
# (`isomp4` + `aac`). Keep the common open formats explicit so /play does not
# silently queue a track that the runtime cannot parse.
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "alac",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav"
] }
tokio = { version = "1", features = [
    "rt",
    "macros",
    "rt-multi-thread"
] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "socks"
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
dotenv = "0.15"

[profile.dev]
debug = 0
debug-assertions = false
opt-level = 1

[profile.release]
opt-level = "z" # minimum binary size
lto = true
codegen-units = 1 # maximum optimization in release
strip = true
debug = 0
